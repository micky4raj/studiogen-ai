name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          # Tests import lib/supabase.ts and lib/credits.ts at the module level,
          # which read these via process.env but never call createClient()
          # outside a function body — dummy values are enough to satisfy the
          # non-null assertions without needing a real Supabase project in CI.
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder"

  # Runs on every push, separate from the PR-gating `verify` job above, so a
  # broken build is visible immediately on main without blocking PR feedback
  # on typecheck/lint/test alone (build is slower and needs real-looking env
  # values for anything imported at module scope during the Next.js build).
  build:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder"
          ANTHROPIC_API_KEY: "placeholder"
          REPLICATE_API_TOKEN: "placeholder"
          STRIPE_SECRET_KEY: "sk_test_placeholder"
          RAZORPAY_KEY_ID: "placeholder"
          RAZORPAY_KEY_SECRET: "placeholder"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
